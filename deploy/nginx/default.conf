upstream frontend {
    server frontend:80;
}

upstream auth_service {
    server auth-service:2101;
}

upstream document_service {
    server document-service:2102;
}

upstream esign_service {
    server e-sign-service:2103;
}

upstream pdf_service {
    server pdf-service:2104;
}

upstream api_service {
    server api-service:2105;
}

upstream template_service {
    server template-service:2106;
}

upstream support_service {
    server support-service:2107;
}

upstream ai_assistant_service {
    server ai-assistant-service:2108;
}

upstream subscription_service {
    server subscription-service:2110;
}

upstream organization_service {
    server organization-service:2111;
}

upstream admin_service {
    server admin-service:3100;
}

server {
    listen 80;
    server_name esp.documantra.in;

    client_max_body_size 100M;

    # Required for auth-service HTTPS redirect / secure cookies behind TLS terminator
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /auth/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        proxy_pass http://auth_service/;
    }

    location /document/ {
        proxy_pass http://document_service/;
    }

    location /esign/ {
        client_max_body_size 100M;
        proxy_pass http://esign_service/;
    }

    location /uploads/ {
        proxy_pass http://esign_service/uploads/;
    }

    location /pdf/ {
        proxy_pass http://pdf_service/;
    }

    location /service/ {
        proxy_pass http://api_service/;
    }

    location /template/ {
        proxy_pass http://template_service/;
    }

    location /support/ {
        proxy_pass http://support_service/;
    }

    location /ai/ {
        proxy_pass http://ai_assistant_service/;
    }

    location /subscription/ {
        proxy_pass http://subscription_service/;
    }

    location /organization/ {
        proxy_pass http://organization_service/;
    }

    location /admin/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        proxy_pass http://admin_service/;
    }

    location = /security.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location ^~ /.well-known/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://frontend;
    }
}
