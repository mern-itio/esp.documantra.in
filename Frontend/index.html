<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same brand favicon as documantra.com / other DocuMantra tabs (BrandingHead may refresh from Supabase) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Fasthand&family=Dancing+Script&family=Cedarville+Cursive&display=swap" rel="stylesheet">   
    <title>DocuMantra</title>
    <script>
      (function () {
        try {
          var k = 'documantra-theme';
          var s = localStorage.getItem(k);
          if (s === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
