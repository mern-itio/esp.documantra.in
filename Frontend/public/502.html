<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Service temporarily unavailable</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f8fafc 0%, #fff 100%);
      color: #0f172a;
      padding: 1.5rem;
    }
    main { text-align: center; max-width: 28rem; }
    .code { color: #d97706; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
    h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #475569; line-height: 1.6; margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      background: #4f46e5;
      color: #fff;
      text-decoration: none;
      padding: 0.625rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
    }
    a:hover { background: #4338ca; }
  </style>
</head>
<body>
  <main>
    <p class="code">502</p>
    <h1>Service temporarily unavailable</h1>
    <p>We are having trouble reaching our servers. Please try again in a few moments.</p>
    <a href="/">Return to home</a>
  </main>
</body>
</html>
