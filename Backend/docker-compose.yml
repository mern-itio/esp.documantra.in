services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "2101:2101"
    volumes:
    - ./services/auth-service:/app/services/auth-service:cached
    - /app/services/auth-service/node_modules

    command: npm run dev


  pdf-service:
    build:
      context: .
      dockerfile: services/pdf-service/Dockerfile
    ports:
      - "2104:2104"
    volumes:
    - ./services/pdf-service:/app/services/pdf-service:cached
    - /app/services/pdf-service/node_modules
    command: npm run dev
  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    ports:
      - "2102:2102"
    volumes:
      - ./services/document-service:/app/services/document-service:cached
      - /app/services/document-service/node_modules
    command: npm run dev
    
  e-sign-service:
    build:
      context: .
      dockerfile: services/e-sign-service/Dockerfile
    ports:
      - "2103:2103"
    volumes:
      - ./services/e-sign-service:/app/services/e-sign-service:cached
      - /app/services/e-sign-service/node_modules
      - ./services/e-sign-service/uploads:/app/services/e-sign-service/uploads  # <-- added
    command: npm run dev

  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    ports:
      - "2105:2105"
    volumes:
      - ./services/api-service:/app/services/api-service:cached
      - /app/services/api-service/node_modules
      - ./services/api-service/uploads:/app/services/api-service/uploads  # <-- added
    command: npm run dev

  template-service:
    build:
      context: .
      dockerfile: services/template-service/Dockerfile
    ports:
      - "2106:2106"
    volumes:
      - ./services/template-service:/app/services/template-service:cached
      - /app/services/template-service/node_modules
      - ./services/template-service/uploads:/app/services/template-service/uploads  # <-- added
    command: npm run dev
