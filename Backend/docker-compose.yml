# L32: bind service ports to localhost only — public access via nginx (80/443).
services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "127.0.0.1:2101:2101"
    volumes:
    - ./services/auth-service:/app/services/auth-service:cached
    - /app/services/auth-service/node_modules
    - ./packages/validators:/app/packages/validators:cached
    - /app/packages/validators/node_modules
    - ./packages/auth-lib:/app/packages/auth-lib:cached
    - /app/packages/auth-lib/node_modules

    command: npm run dev

  pdf-service:
    build:
      context: .
      dockerfile: services/pdf-service/Dockerfile
    ports:
      - "127.0.0.1:2104:2104"
    volumes:
    - ./services/pdf-service:/app/services/pdf-service:cached
    - /app/services/pdf-service/node_modules
    - ./packages/validators:/app/packages/validators:cached
    - /app/packages/validators/node_modules
    - ./packages/auth-lib:/app/packages/auth-lib:cached
    - /app/packages/auth-lib/node_modules
    - ./services/pdf-service/uploads:/app/services/pdf-service/uploads
    - ./services/pdf-service/outputs:/app/services/pdf-service/outputs
    env_file:
      - ./services/pdf-service/.env
    environment:
      - NODE_ENV=development
      - DEBUG=pdf-extract-tables
      - PYTHON_PATH=/opt/venv/bin/python
   
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    command: npm run dev

  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    ports:
      - "127.0.0.1:2102:2102"
    volumes:
      - ./services/document-service:/app/services/document-service:cached
      - /app/services/document-service/node_modules
      - ./packages/validators:/app/packages/validators:cached
      - /app/packages/validators/node_modules
      - ./packages/auth-lib:/app/packages/auth-lib:cached
      - /app/packages/auth-lib/node_modules
    command: npm run dev

  e-sign-service:
    build:
      context: .
      dockerfile: services/e-sign-service/Dockerfile
    ports:
      - "127.0.0.1:2103:2103"
    volumes:
      - ./services/e-sign-service:/app/services/e-sign-service:cached
      - /app/services/e-sign-service/node_modules
      - ./packages/validators:/app/packages/validators:cached
      - /app/packages/validators/node_modules
      - ./packages/auth-lib:/app/packages/auth-lib:cached
      - /app/packages/auth-lib/node_modules
      - ./services/e-sign-service/uploads:/app/services/e-sign-service/uploads  # <-- added
    command: npm run dev

  subscription-service:
    build:
      context: .
      dockerfile: services/subscription-service/Dockerfile
    ports:
      - "127.0.0.1:2110:2110"
    volumes:
      - ./services/subscription-service:/app/services/subscription-service:cached
      - /app/services/subscription-service/node_modules
      - ./packages/validators:/app/packages/validators:cached
      - /app/packages/validators/node_modules
      - ./packages/auth-lib:/app/packages/auth-lib:cached
      - /app/packages/auth-lib/node_modules
      - ./services/subscription-service/uploads:/app/services/subscription-service/uploads  # <-- added
    command: npm run dev

  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    ports:
      - "127.0.0.1:2105:2105"
    volumes:
      - ./services/api-service:/app/services/api-service:cached
      - /app/services/api-service/node_modules
      - ./packages/validators:/app/packages/validators:cached
      - /app/packages/validators/node_modules
      - ./packages/auth-lib:/app/packages/auth-lib:cached
      - /app/packages/auth-lib/node_modules
      - ./services/api-service/uploads:/app/services/api-service/uploads  # <-- added
    command: npm run dev

  template-service:
    build:
      context: .
      dockerfile: services/template-service/Dockerfile
    ports:
      - "127.0.0.1:2106:2106"
    volumes:
      - ./services/template-service:/app/services/template-service:cached
      - /app/services/template-service/node_modules
      - ./packages/validators:/app/packages/validators:cached
      - /app/packages/validators/node_modules
      - ./packages/auth-lib:/app/packages/auth-lib:cached
      - /app/packages/auth-lib/node_modules
      - ./services/template-service/uploads:/app/services/template-service/uploads  # <-- added
    command: npm run dev
    
  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./services/admin-service:/app/services/admin-service:cached
      - /app/services/admin-service/node_modules
      - ./packages/validators:/app/packages/validators:cached
      - /app/packages/validators/node_modules
      - ./packages/auth-lib:/app/packages/auth-lib:cached
      - /app/packages/auth-lib/node_modules
      - ./services/admin-service/uploads:/app/services/admin-service/uploads  # <-- added
    command: npm run dev
    env_file:
      - ./services/admin-service/.env

  support-service:
    build:
      context: .
      dockerfile: services/support-service/Dockerfile
    ports:
      - "127.0.0.1:2107:2107"
    volumes:
      - ./services/support-service:/app/services/support-service:cached
      - /app/services/support-service/node_modules
      - ./packages/validators:/app/packages/validators:cached
      - /app/packages/validators/node_modules
      - ./packages/auth-lib:/app/packages/auth-lib:cached
      - /app/packages/auth-lib/node_modules
      - ./services/support-service/uploads:/app/services/support-service/uploads
    command: npm run dev
    env_file:
      - ./services/support-service/.env

  ai-assistant-service:
    build:
      context: .
      dockerfile: services/ai-assistant-service/Dockerfile
    ports:
      - "127.0.0.1:2108:2108"
    volumes:
      - ./services/ai-assistant-service:/app/services/ai-assistant-service:cached
      - /app/services/ai-assistant-service/node_modules
      - ./packages/validators:/app/packages/validators:cached
      - /app/packages/validators/node_modules
      - ./packages/auth-lib:/app/packages/auth-lib:cached
      - /app/packages/auth-lib/node_modules
    command: npm run dev
    env_file:
      - ./services/ai-assistant-service/.env
    environment:
      - DOCUMENT_SERVICE_URL=http://document-service:2102
      - ESIGN_SERVICE_URL=http://e-sign-service:2103
      - SUBSCRIPTION_SERVICE_URL=http://subscription-service:2110
      
  organization-service:
    build:
      context: .
      dockerfile: services/organization-service/Dockerfile
    ports:
      - "127.0.0.1:2111:2111"
    volumes:
      - ./services/organization-service:/app/services/organization-service:cached
      - /app/services/organization-service/node_modules
      - ./packages/validators:/app/packages/validators:cached
      - /app/packages/validators/node_modules
      - ./packages/auth-lib:/app/packages/auth-lib:cached
      - /app/packages/auth-lib/node_modules
      - ./services/organization-service/uploads:/app/services/organization-service/uploads  # <-- added
    command: npm run dev

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "127.0.0.1:2113:2113"
    volumes:
    - ./services/api-gateway:/app/services/api-gateway:cached
    - /app/services/api-gateway/node_modules
    - ./packages/validators:/app/packages/validators:cached
    - /app/packages/validators/node_modules
    - ./packages/auth-lib:/app/packages/auth-lib:cached
    - /app/packages/auth-lib/node_modules

    command: npm run dev
  
  email-service:
    build:
      context: .
      dockerfile: services/email-service/Dockerfile
    ports:
      - "127.0.0.1:2112:2112"
    volumes:
    - ./services/email-service:/app/services/email-service:cached
    - /app/services/email-service/node_modules
    - ./packages/validators:/app/packages/validators:cached
    - /app/packages/validators/node_modules
    - ./packages/auth-lib:/app/packages/auth-lib:cached
    - /app/packages/auth-lib/node_modules

    command: npm run dev

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    ports:
      - "127.0.0.1:2114:2114"
    volumes:
    - ./services/identity-service:/app/services/identity-service:cached
    - /app/services/identity-service/node_modules
    - ./packages/validators:/app/packages/validators:cached
    - /app/packages/validators/node_modules
    - ./packages/auth-lib:/app/packages/auth-lib:cached
    - /app/packages/auth-lib/node_modules

    command: npm run dev

  pdf-java-service:
    build:
      context: .
      dockerfile: services/pdf-java-service/Dockerfile
    ports:
      - "127.0.0.1:2115:2115"
    volumes:
      - ./services/pdf-java-service:/app/services/pdf-java-service:cached
    environment:
      - JAVA_OPTS=-Xmx1G -Xms512m
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G